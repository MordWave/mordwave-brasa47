name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Read-only token for every job; no secrets are used anywhere in this workflow.
permissions:
  contents: read

# A newer push to the same PR cancels the older run. Every other event (main, manual) gets a group of its own, so a run
# on main is never cancelled or replaced by a later one.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend:
    name: frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: node --version && npm --version
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  backend:
    name: backend
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # backend/package.json engines: node >=24.11.0 <25.0.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: node --version && npm --version
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test

  # The single check to look at before merging: green only when every required job succeeded. `always()` makes it run
  # (and fail) when a needed job failed, was cancelled or was skipped.
  ci-ok:
    name: ci-ok
    needs: [frontend, backend]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Require every job to have succeeded
        env:
          FRONTEND: ${{ needs.frontend.result }}
          BACKEND: ${{ needs.backend.result }}
        run: |
          echo "frontend: $FRONTEND"
          echo "backend: $BACKEND"
          if [ "$FRONTEND" != "success" ] || [ "$BACKEND" != "success" ]; then
            echo "A required job did not succeed."
            exit 1
          fi
